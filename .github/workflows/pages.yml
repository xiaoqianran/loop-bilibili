# ModelScope → static site → GitHub Pages (Actions deploy, not gh-pages branch).
#
# Repo Pages source must be: Settings → Pages → Build and deployment → GitHub Actions
# (NOT "Deploy from a branch". Branch deploy was stuck in deployment_queued timeouts.)
#
# Actions never scrape B 站 — only pull ModelScope snapshots and publish HTML/JSON.
name: Deploy subtitle site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all from ModelScope'
        required: false
        default: ''
  # reusable entry for daily-pipeline.yml
  workflow_call:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all'
        required: false
        type: string
        default: ''
  schedule:
    # Daily UTC 16:00 ≈ 北京 00:00
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtitle_site.py'
      - 'scripts/fetch_modelscope_v2.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/daily-pipeline.yml'

# Official Pages deploy needs pages + id-token. contents:read is enough (no branch push).
permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-flight deploys — canceling can leave the Pages deploy lock stuck.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install 'modelscope>=1.20'

      - name: Fetch snapshots from ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODELSCOPE_API_TOKEN:-}" ]; then
            echo "MODELSCOPE_API_TOKEN secret missing" >&2
            exit 1
          fi
          # workflow_dispatch and workflow_call both expose inputs.snapshots
          NAMES="${{ inputs.snapshots }}"
          if [ -n "$NAMES" ]; then
            IFS=',' read -ra ARR <<< "$NAMES"
            ARGS=()
            for n in "${ARR[@]}"; do
              n="$(echo "$n" | xargs)"
              [ -n "$n" ] && ARGS+=(--name "$n")
            done
            python scripts/fetch_modelscope_v2.py "${ARGS[@]}"
          else
            python scripts/fetch_modelscope_v2.py --all
          fi
          ls -la data/v2/*.db || true

      - name: Build static site
        run: |
          set -euo pipefail
          # Project Pages live under /loop-bilibili/ — absolute SITE_BASE paths
          python scripts/build_subtitle_site.py \
            --from-dir data/v2 \
            --out site \
            --base-url /loop-bilibili
          # smoke checks
          test -f site/index.html
          test -f site/assets/app.js
          grep -q 'SITE_BASE' site/assets/app.js
          grep -q "loadJSON('/data/" site/assets/app.js
          # avoid Jekyll processing if anyone reverts to branch deploy
          touch site/.nojekyll
          echo "files=$(find site -type f | wc -l) size=$(du -sh site | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
