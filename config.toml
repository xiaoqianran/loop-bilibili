# loop-bilibili v2 configuration (read by the app)

[database]
path = "data/v2/loop.db"

[sources]
# Homepage personalized rcmd (CLI once/worker)
homepage_enabled = false
homepage_pages = 1
homepage_ps = 12

# Creators to scrape (scripts/scrape_creator.py --from-config)
[[sources.creators]]
mid = "2071007724"
name = "海安雨"
slug = "haianyu"

[[sources.creators]]
mid = "346591207"
name = "肖老师的退休生活"
slug = "xiaolaoshi"

[worker]
poll_interval = 2.0
subtitle_language = "zh"
job_delay = 0.55
job_jitter = 0.15
retry_delay = 60.0
risk_base_delay = 15.0
risk_max_delay = 300.0

[runtime]
cookie = ""
require_cookie = false

[backup]
# ModelScope private dataset (scripts/push_modelscope_v2.py)
namespace = "yuminghui"
dataset = "loop-bilibili-v2"
