# HF snapshots → static site → GitHub Pages
#
# Publish path: Actions artifact + actions/deploy-pages (build_type=workflow).
# Do NOT use branch/gh-pages pages-build-deployment — that queue was stuck/errored
# for this repo (duration=0 "Page build failed" / multi-hour "building").
#
# Actions never scrape B 站. Only: fetch HF → build HTML → deploy.
name: Deploy subtitle site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all from Hugging Face'
        required: false
        default: ''
  workflow_call:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all'
        required: false
        type: string
        default: ''
  schedule:
    # Daily UTC 16:00 ≈ 北京 00:00 — one rebuild/day is enough
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtitle_site.py'
      - 'scripts/fetch_hf_v2.py'
      - 'scripts/deploy_site.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/daily-pipeline.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy only. Cancel older queued runs so they do not pile up
# behind a dead lock (previous cancel-in-progress:false caused 15m queue cancels).
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install 'huggingface_hub>=0.23'

      - name: Fetch snapshots from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: seachen/loop-bilibili-v2
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret missing — add repo secret HF_TOKEN" >&2
            exit 1
          fi
          NAMES="${{ inputs.snapshots }}"
          if [ -n "${NAMES:-}" ]; then
            IFS=',' read -ra ARR <<< "$NAMES"
            ARGS=()
            for n in "${ARR[@]}"; do
              n="$(echo "$n" | xargs)"
              [ -n "$n" ] && ARGS+=(--name "$n")
            done
            python scripts/fetch_hf_v2.py "${ARGS[@]}"
          else
            # Prefer product snapshots; fall back to all if empty
            if python scripts/fetch_hf_v2.py --name loop --name haianyu --name xiaolaoshi 2>/dev/null; then
              true
            else
              python scripts/fetch_hf_v2.py --all
            fi
          fi
          ls -la data/v2/*.db || true

      - name: Build static site
        run: |
          set -euo pipefail
          python scripts/build_subtitle_site.py \
            --from-dir data/v2 \
            --out site \
            --base-url /loop-bilibili
          test -f site/index.html
          test -f site/assets/app.js
          grep -q 'SITE_BASE' site/assets/app.js
          grep -q "loadJSON('/data/" site/assets/app.js
          # loop.db must be published when present (homepage feed + mermaid)
          if [ -f data/v2/loop.db ]; then
            test -f site/data/loop/meta.json
          fi
          touch site/.nojekyll
          echo "files=$(find site -type f | wc -l) size=$(du -sh site | cut -f1)"
          # smoke: at least one mermaid diagram if analyses exist
          python - <<'PY'
          import json
          from pathlib import Path
          n = 0
          for p in Path("site/data").rglob("v/*.json"):
              d = json.loads(p.read_text(encoding="utf-8"))
              if d.get("diagram_count") or d.get("diagrams"):
                  n += 1
          print(f"videos_with_mermaid={n}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
