# User preference profile for subtitle enqueue filtering.
# Layer: keywords (core) + related (neighbor concepts) + soft CJK n-grams.
# This is foundation scoring — not an LLM.

[preference]
threshold = 0.35
related_weight = 0.65
soft_weight = 0.40
min_term_len = 2
# hard reject if title contains these
must_not = ["带货", "抽奖", "广告"]

[[preference.interests]]
id = "llm_agent"
weight = 1.0
keywords = [
  "大模型", "LLM", "Agent", "智能体", "RAG", "微调", "transformers",
  "prompt", "推理模型", "多模态",
]
related = [
