# Thin alias: same job as pages.yml (ModelScope → Pages).
# Kept so the "Sync ModelScope → Pages" name stays discoverable in the Actions UI.
#
# 抓取请在本机/自有服务器跑（Actions 不需要 BILI_COOKIE）：
#   PYTHONPATH=src python scripts/try_homepage_guest.py
#   PYTHONPATH=src python3 -m loop_bilibili once
#   python scripts/push_modelscope_v2.py --name <slug>
#
name: Sync ModelScope → Pages

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all'
        required: false
        default: ''
  # Daily schedule lives in pages.yml (single clock). Manual runs use this alias.

# Concurrency is owned by pages.yml (group: pages). Do not set a second lock here
# or the reusable call can wait on itself.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      snapshots: ${{ inputs.snapshots }}
