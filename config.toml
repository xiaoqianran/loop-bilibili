# loop-bilibili v2 configuration (read by the app)
#
# 产品主路径（规划中）：常驻刷首页推荐 → 规则筛选 → 入队抓字幕
# Cookie 不是必须；无 Cookie = 访客态首页/接口，可能有频控，但不强制登录。

[database]
path = "data/v2/loop.db"

[sources]
# 主路径：首页推荐（访客也可刷；登录态才是「个性化」）
homepage_enabled = true
homepage_pages = 2
homepage_ps = 12
# 长跑 cadence（loop-bilibili run）：两次首页发现之间的最小间隔（秒）
homepage_interval_s = 600

# 可选：额外全量同步的博主（不是主路径；需要时再开）
# [[sources.creators]]
# mid = "2071007724"
# name = "海安雨"
# slug = "haianyu"

[worker]
poll_interval = 2.0
subtitle_language = "zh"
# 串行限速即可，不依赖 Cookie
job_delay = 0.8
job_jitter = 0.2
retry_delay = 60.0
risk_base_delay = 15.0
risk_max_delay = 300.0
# 每个发现周期后最多处理多少字幕/分析任务
jobs_per_cycle = 50

[runtime]
# 个性化首页：不要把 Cookie 写进本文件（会进 git）。
# 请用环境变量或 gitignored .env：
#   BILI_COOKIE='SESSDATA=...; bili_jct=...; DedeUserID=...; buvid3=...'
# 有 SESSDATA 时 homepage rcmd / 字幕请求都会带 Cookie → 账号个性化推荐。
# 空 = 访客态（也能刷，但不个性化）。
cookie = ""
# true = 没有 SESSDATA 直接退出（强制个性化）
require_cookie = false

[backup]
namespace = "yuminghui"
dataset = "loop-bilibili-v2"

# Preference filter foundation (keywords + related + soft CJK n-grams)
[preference]
enabled = true
path = "preferences.toml"

# LLM post-process: multi-model Mermaid learning graphs
# API key NEVER in git — put in .env:
#   AI_API_KEY=nvapi-...
# 双模型：第一项 = 默认展示模型（Pages 默认 / 列表默认）
#   google/diffusiongemma-26b-a4b-it  ← 默认
#   openai/gpt-oss-120b              ← 可切换对照
[ai]
enabled = true
base_url = "https://nim.202820.xyz/v1"
models = [
  "openai/gpt-oss-120b",
  "google/diffusiongemma-26b-a4b-it",
]
temperature = 0.4
max_tokens = 8192
max_subtitle_chars = 80000
timeout_s = 180
mode = "mermaid"
# 单次 HTTP 请求内：超时/429/5xx 自动再试（额外次数）
request_retries = 2
request_retry_backoff_s = 2.0
# 任务队列：claim 失败后最多尝试次数，再永久 failed
max_attempts = 3
job_retry_delay_s = 60.0
# custom_instruction = ""
