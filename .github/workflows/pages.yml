name: Deploy subtitle site to GitHub Pages

on:
  # Manual rebuild
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all from ModelScope'
        required: false
        default: ''
  # Daily rebuild from ModelScope (UTC 16:00 ≈ 北京时间 00:00)
  schedule:
    - cron: '0 16 * * *'
  # Rebuild when site tooling changes
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtitle_site.py'
      - 'scripts/fetch_modelscope_v2.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install 'modelscope>=1.20'

      - name: Fetch snapshots from ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          if [ -z "$MODELSCOPE_API_TOKEN" ]; then
            echo "MODELSCOPE_API_TOKEN secret missing" >&2
            exit 1
          fi
          NAMES="${{ github.event.inputs.snapshots }}"
          if [ -n "$NAMES" ]; then
            IFS=',' read -ra ARR <<< "$NAMES"
            ARGS=()
            for n in "${ARR[@]}"; do
              n="$(echo "$n" | xargs)"
              [ -n "$n" ] && ARGS+=(--name "$n")
            done
            python scripts/fetch_modelscope_v2.py "${ARGS[@]}"
          else
            python scripts/fetch_modelscope_v2.py --all
          fi
          ls -la data/v2/*.db || true

      - name: Build static site
        run: |
          # Project Pages live under /loop-bilibili/ — use absolute base paths
          python scripts/build_subtitle_site.py \
            --from-dir data/v2 \
            --out site \
            --base-url /loop-bilibili
          # smoke: path helpers must use SITE_BASE + absolute /data/
          grep -q 'SITE_BASE' site/assets/app.js
          grep -q "loadJSON('/data/" site/assets/app.js
          find site -type f | wc -l
          du -sh site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
