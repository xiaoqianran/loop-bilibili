# Thin alias: same job as pages.yml (Hugging Face → Pages).
# Kept so "Sync HF → Pages" stays discoverable in the Actions UI.
#
# 抓取请在本机跑（Actions 不需要 BILI_COOKIE）：
#   PYTHONPATH=src python3 -m loop_bilibili run
#   python scripts/push_hf_v2.py --name loop
#   python scripts/deploy_site.py --wait
#
name: Sync HF → Pages

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all'
        required: false
        default: 'loop,haianyu,xiaolaoshi'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      snapshots: ${{ inputs.snapshots }}
