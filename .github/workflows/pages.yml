# Hugging Face dataset → static site → GitHub Pages (Actions artifact deploy).
#
# Repo Pages source: Settings → Pages → Build and deployment → GitHub Actions
# (NOT "Deploy from a branch" — branch deploy was stuck in deployment_queued.)
#
# Actions never scrape B 站 — only pull HF snapshots and publish HTML/JSON.
name: Deploy subtitle site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all from Hugging Face'
        required: false
        default: ''
  workflow_call:
    inputs:
      snapshots:
        description: 'Snapshot names (comma-separated), empty = all'
        required: false
        type: string
        default: ''
  schedule:
    # Daily UTC 16:00 ≈ 北京 00:00
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtitle_site.py'
      - 'scripts/fetch_hf_v2.py'
      - 'scripts/push_hf_v2.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/daily-pipeline.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-flight deploys — canceling can leave the Pages deploy lock stuck.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install 'huggingface_hub>=0.23'

      - name: Fetch snapshots from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: seachen/loop-bilibili-v2
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret missing — add repo secret HF_TOKEN (Hugging Face write/read token)" >&2
            exit 1
          fi
          NAMES="${{ inputs.snapshots }}"
          if [ -n "$NAMES" ]; then
            IFS=',' read -ra ARR <<< "$NAMES"
            ARGS=()
            for n in "${ARR[@]}"; do
              n="$(echo "$n" | xargs)"
              [ -n "$n" ] && ARGS+=(--name "$n")
            done
            python scripts/fetch_hf_v2.py "${ARGS[@]}"
          else
            python scripts/fetch_hf_v2.py --all
          fi
          ls -la data/v2/*.db || true

      - name: Build static site
        run: |
          set -euo pipefail
          python scripts/build_subtitle_site.py \
            --from-dir data/v2 \
            --out site \
            --base-url /loop-bilibili
          test -f site/index.html
          test -f site/assets/app.js
          grep -q 'SITE_BASE' site/assets/app.js
          grep -q "loadJSON('/data/" site/assets/app.js
          touch site/.nojekyll
          echo "files=$(find site -type f | wc -l) size=$(du -sh site | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
